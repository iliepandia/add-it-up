</head>
<body>
  <div id="rotateOverlay">
    <div class="rotate-icon">📱</div>
    <p>Please rotate your device to portrait to play</p>
  </div>

  <div id="bg">
    <div class="sun"></div>
    <div class="cloud c1">☁️</div><div class="cloud c2">☁️</div><div class="cloud c3">☁️</div>
    <div class="hills"><div class="hill h1"></div><div class="hill h2"></div></div>
    <div class="stars-layer"></div>
  </div>

  <div id="app">
    <div id="stars" aria-label="stars earned"></div>
    <div id="stage">
      <div id="card">
        <div class="operand" id="opA"></div>
        <div class="op">+</div>
        <div class="operand" id="opB"></div>
        <div class="op">=</div>
        <div id="ans"><span id="caret"></span></div>
      </div>
    </div>
    <div id="keypad"></div>
  </div>

  <div id="fx"></div>
  <div id="flash"></div>

  <div id="win">
    <h1>Good job!</h1>
    <div id="trophies"></div>
    <p>Tap to play again</p>
    <button id="playBtn" type="button">Play</button>
    <div id="winfx"></div>
  </div>

  <div id="themePicker">
    <h1>Pick a world!</h1>
    <div class="pick-grid">
      <button class="pick" data-theme="classic" aria-label="Classic"><span class="lbl">👦</span></button>
      <button class="pick" data-theme="nature" aria-label="Nature"><span class="lbl">🌳</span></button>
      <button class="pick" data-theme="space" aria-label="Space"><span class="lbl">🚀</span></button>
      <button class="pick" data-theme="animal" aria-label="Animals"><span class="lbl">🐔</span></button>
    </div>
    <button id="prizeBoxLink" type="button" class="prize-box-link" aria-label="Prize box"><span class="lbl">📦</span></button>
    <p id="buildVer" class="build-ver"></p>
    <button id="statsLink" type="button" class="stats-link">📊 Stats</button>
  </div>

  <div id="prizeBox">
    <button id="prizeBoxBack" type="button" class="prize-back-btn" aria-label="Back">←</button>
    <h1>Prize Box</h1>
    <div class="prize-scroll-wrap">
      <div id="prizeStrip" class="prize-strip"></div>
    </div>
  </div>

  <div id="statsScreen">
    <div class="stats-scroll">
      <h1>Your stats</h1>
      <div id="statsGrid" class="stats-grid"></div>

      <section class="stats-chart-section">
        <h2>Last 30 games</h2>
        <div id="chartGames" class="stats-chart"></div>
      </section>

      <section class="stats-chart-section">
        <h2>Last 30 days</h2>
        <div id="chartMonth" class="stats-chart"></div>
      </section>

      <section class="stats-chart-section">
        <h2>Trickiest problems</h2>
        <ol id="mistakesList" class="mistakes-list"></ol>
      </section>
    </div>

    <div class="stats-actions">
      <button id="statsClose" type="button" class="stats-close-btn">Close</button>
      <div class="reset-area">
        <button id="statsResetBtn" type="button" class="stats-reset-btn">Reset stats</button>
        <div id="resetConfirm" class="reset-confirm" hidden>
          <p>Delete all stats? This can't be undone.</p>
          <div class="reset-confirm-btns">
            <button id="resetCancel" type="button">Cancel</button>
            <button id="resetConfirmBtn" type="button" class="danger">Yes, delete everything</button>
          </div>
        </div>
      </div>
    </div>
  </div>

</body>
</html>
